[workspace]
resolver = "2"
members = ["crates/cow-rs"]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
authors = ["cow-rs contributors"]
repository = "https://github.com/cowdao-grants/cow-rs"
readme = "README.md"

[workspace.lints.rust]
missing-debug-implementations = "warn"
missing-docs = "warn"
unreachable-pub = "warn"
unused-must-use = "deny"
rust-2018-idioms = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing-const-for-fn = "warn"
use-self = "warn"
option-if-let-else = "warn"
redundant-clone = "warn"

[workspace.dependencies]
alloy-primitives = { version = "1.5.7", default-features = false, features = ["std", "serde", "k256"] }
alloy-signer = { version = "1.8.3", default-features = false }
alloy-signer-local = { version = "1.8.3", default-features = false }
alloy-sol-types = { version = "1.5.7", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
const-hex = "1"
hex-literal = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
tokio = { version = "1", default-features = false }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
