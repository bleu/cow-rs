[package]
name = "cow-sdk-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "JavaScript bindings for the cowprotocol Rust SDK. Publishes to npm as @cowdao-grants/cow-sdk-wasm; not published to crates.io."
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# In-shim signing pulls in `alloy-signer` and `alloy-signer-local` so
# the wasm crate can accept a private-key hex string and produce
# signatures inside linear memory. Off by default: production
# integrations sign with viem / ethers / Safe and only need this crate
# to compute the EIP-712 typed-data hash. Enabling this feature adds
# ~80-120 KB of crypto code to the wasm binary.
in_shim_signing = ["dep:alloy-signer", "dep:alloy-signer-local"]

[dependencies]
# `default-features = false` drops the `subgraph` GraphQL client from
# cowprotocol; not reachable from the JS surface and pure dead weight
# in the wasm binary.
cowprotocol = { path = "../cowprotocol", version = "1.0.0-alpha", default-features = false }
alloy-primitives.workspace = true
alloy-signer = { workspace = true, optional = true }
alloy-signer-local = { workspace = true, optional = true }
const-hex.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Tiny global allocator (~5 KB) to replace dlmalloc on wasm32. The shim
# is single-threaded, so we wrap the free-list allocator in
# `AssumeSingleThreaded` to skip the lock.
lol_alloc = "0.4"

[package.metadata.wasm-pack.profile.release]
# -Oz biases binaryen for binary size over speed (~30% smaller than
# the default -O). Hot paths in this shim are network-bound (reqwest)
# or one-shot EIP-712 hashing; speed regressions from -Oz are not
# user-visible. Bulk-memory + mutable-globals are baseline post-MVP
# features all the targeted browsers ship.
wasm-opt = [
    "-Oz",
    # Match the post-MVP wasm features the Rust 1.91 compiler emits by
    # default for wasm32-unknown-unknown. Without these wasm-opt fails
    # validation on trunc_sat_f64_u, sign-extension ops, etc.
    "--enable-bulk-memory",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-reference-types",
]
