[package]
name = "cowprotocol"
version = "1.0.0-alpha.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Rust SDK for CoW Protocol: orderbook client, EIP-712 order types, signing, and composable-order primitives."
homepage = "https://github.com/cowdao-grants/cow-rs"
documentation = "https://docs.rs/cowprotocol"
keywords = ["cow-protocol", "ethereum", "defi", "alloy", "sdk"]
categories = ["cryptography::cryptocurrencies", "api-bindings", "wasm"]

[lints]
workspace = true

[features]
default = ["http-client", "subgraph"]
# `http-client` enables the orderbook + trading HTTP client. Hashing
# and signing-only consumers (PG extension via pgrx, FFI shim,
# embedded context, etc.) disable it to drop `reqwest` and its
# transitive graph from the build.
http-client = ["dep:reqwest"]
# `subgraph` enables the GraphQL client. It depends on `http-client`
# because the subgraph executor uses `reqwest` internally.
subgraph = ["http-client"]

[dependencies]
alloy-primitives.workspace = true
alloy-signer.workspace = true
cowprotocol-appdata = { version = "1.0.0-alpha.3", path = "../cowprotocol-appdata" }
cowprotocol-primitives = { version = "1.0.0-alpha.3", path = "../cowprotocol-primitives" }
cowprotocol-signing = { version = "1.0.0-alpha.3", path = "../cowprotocol-signing" }
serde = { workspace = true }
serde_json.workspace = true
serde_with.workspace = true
thiserror.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["rustls-tls"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { workspace = true, optional = true }
# Wires alloy's PRNG into the browser's `crypto.getRandomValues`; this
# is signing-only, not HTTP-only, so it stays outside the `http-client`
# gate.
getrandom = { workspace = true, features = ["js"] }

[dev-dependencies]
alloy-signer-local.workspace = true
const-hex.workspace = true
hex-literal.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wiremock.workspace = true
# Builds a `reqwest::Response` from an in-memory body with no
# `Content-Length` header, to exercise the streaming response cap.
http = "1"

# Both examples drive the async orderbook client, so they only build
# when `http-client` is on (it is, by default).
[[example]]
name = "get_quote"
required-features = ["http-client"]

[[example]]
name = "post_order"
required-features = ["http-client"]
