[package]
name = "cowprotocol-signing"
version = "1.0.0-alpha.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "CoW Protocol signing schemes: EIP-712, EthSign, EIP-1271, PreSign. Re-exports the `cowprotocol::signing` namespace."
homepage = "https://github.com/cowdao-grants/cow-rs"
documentation = "https://docs.rs/cowprotocol-signing"
keywords = ["cow-protocol", "ethereum", "defi", "signing", "eip-712"]
categories = ["cryptography::cryptocurrencies", "api-bindings", "wasm"]

[lints]
workspace = true

[dependencies]
cowprotocol = { version = "1.0.0-alpha.3", path = "../cowprotocol", default-features = false }

[dev-dependencies]
cowprotocol-primitives = { version = "1.0.0-alpha.3", path = "../cowprotocol-primitives" }
