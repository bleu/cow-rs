[package]
name = "cowprotocol-orderbook"
version = "1.0.0-alpha.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "CoW Protocol orderbook DTOs, quote builders, and HTTP client."
homepage = "https://github.com/cowdao-grants/cow-rs"
documentation = "https://docs.rs/cowprotocol-orderbook"
keywords = ["cow-protocol", "ethereum", "defi", "api"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]

[lints]
workspace = true

[features]
default = ["http-client", "subgraph"]
# `alloy-signer` is named by this crate's own code only in the HTTP
# client (`QuotedOrder::sign`) and `TradingClient`, both gated here, so
# the manifest declares it only under `http-client`. Note it is still
# pulled transitively by `cowprotocol-signing` (which owns
# `OrderData::sign`); fully dropping it from a `--no-default-features`
# build would require gating it there too.
http-client = ["dep:reqwest", "dep:alloy-signer"]
subgraph = ["http-client"]

[dependencies]
alloy-primitives.workspace = true
alloy-signer = { workspace = true, optional = true }
cowprotocol-appdata = { version = "1.0.0-alpha.3", path = "../cowprotocol-appdata" }
cowprotocol-primitives = { version = "1.0.0-alpha.3", path = "../cowprotocol-primitives" }
cowprotocol-signing = { version = "1.0.0-alpha.3", path = "../cowprotocol-signing" }
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
thiserror.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["rustls-tls"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { workspace = true, optional = true }

[dev-dependencies]
alloy-signer-local.workspace = true
const-hex.workspace = true
hex-literal.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wiremock.workspace = true
http = "1"
