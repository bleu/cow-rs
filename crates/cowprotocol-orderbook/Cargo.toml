[package]
name = "cowprotocol-orderbook"
version = "1.0.0-alpha.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "CoW Protocol orderbook HTTP client, trading facade, and subgraph queries. Re-exports the `cowprotocol::orderbook` namespace."
homepage = "https://github.com/cowdao-grants/cow-rs"
documentation = "https://docs.rs/cowprotocol-orderbook"
keywords = ["cow-protocol", "orderbook", "ethereum", "defi", "alloy"]
categories = ["cryptography::cryptocurrencies", "api-bindings", "wasm"]

[lints]
workspace = true

[features]
default = ["http-client", "subgraph"]
# Mirror `cowprotocol`'s feature names so a downstream caller can pick
# either crate path with the same feature semantics. The features are
# forwarded to the umbrella crate where the actual gating lives.
http-client = ["cowprotocol/http-client"]
subgraph = ["cowprotocol/subgraph"]

[dependencies]
cowprotocol = { version = "1.0.0-alpha.3", path = "../cowprotocol", default-features = false }

[dev-dependencies]
cowprotocol-primitives = { version = "1.0.0-alpha.3", path = "../cowprotocol-primitives" }
