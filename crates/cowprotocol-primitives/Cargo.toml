[package]
name = "cowprotocol-primitives"
version = "1.0.0-alpha.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "CoW Protocol primitives: chain selectors, EIP-712 domain, 12-field order types, contract bindings, EthFlow, cancellation, ComposableCoW, multiplexer, and orderbook fee-composition arithmetic. Pure compute; no HTTP."
homepage = "https://github.com/cowdao-grants/cow-rs"
documentation = "https://docs.rs/cowprotocol-primitives"
keywords = ["cow-protocol", "ethereum", "defi", "alloy", "sdk"]
categories = ["cryptography::cryptocurrencies", "api-bindings", "wasm"]

[lints]
workspace = true

[dependencies]
# Re-exports the `cowprotocol::primitives` namespace. Sharing the
# implementation keeps the byte-conformance vectors a single source of
# truth across the four sub-crates; future work can lift the modules
# out of `cowprotocol` without changing this crate's public surface.
cowprotocol = { version = "1.0.0-alpha.3", path = "../cowprotocol", default-features = false }
